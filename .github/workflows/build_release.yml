name: Flutter APK Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split APKs
        run: flutter build apk --split-per-abi --release

      - name: Rename APKs for clarity
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KapShorts-universal.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/KapShorts-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/KapShorts-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/KapShorts-x86_64.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KapShorts-APKs
          path: |
            build/app/outputs/flutter-apk/KapShorts-universal.apk
            build/app/outputs/flutter-apk/KapShorts-arm64-v8a.apk
            build/app/outputs/flutter-apk/KapShorts-armeabi-v7a.apk
            build/app/outputs/flutter-apk/KapShorts-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Release Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/KapShorts-universal.apk
            build/app/outputs/flutter-apk/KapShorts-arm64-v8a.apk
            build/app/outputs/flutter-apk/KapShorts-armeabi-v7a.apk
            build/app/outputs/flutter-apk/KapShorts-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
