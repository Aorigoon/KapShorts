name: Flutter Web Deploy to Netlify

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Netlify via API
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # Zip the build/web folder
          cd build/web
          zip -r ../../web_build.zip .
          cd ../..

          # Deploy via Netlify API (zip upload)
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @web_build.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")

          echo "Response: $RESPONSE"
          DEPLOY_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deploy_ssl_url', d.get('url','')))" 2>/dev/null)
          echo "✅ Deployed to: $DEPLOY_URL"
